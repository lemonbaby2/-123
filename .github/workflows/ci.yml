name: portfolio-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q projects scripts
      - run: python scripts/verify_layout.py
      - run: python scripts/run_tests.py
      - run: python scripts/run_all_demos.py
      - run: python scripts/build_bundle.py

  cpp-quadruped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S projects/01_quadruped_slam/cpp -B build/quadruped -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/quadruped --parallel
      - run: ctest --test-dir build/quadruped --output-on-failure

  cpp-bms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S projects/06_bms/cpp -B build/bms -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/bms --parallel
      - run: ctest --test-dir build/bms --output-on-failure
